<svg width="100%" viewBox="0 0 680 770" role="img" xmlns="http://www.w3.org/2000/svg">
<title>IMA Import Declaration Automation — full workflow</title>
<desc>Phase A reconciles ICISNET and SAP data. Phase B loops per MRN: XML download, parse, SAP entry, PDF attach, archive.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: sans-serif; fill: #222; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; fill: #555; }
    .phase-rect { fill: none; stroke: #ccc; stroke-width: 0.5; stroke-dasharray: 4 3; }
    .teal rect   { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
    .teal text   { fill: #085041; }
    .purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
    .purple text { fill: #3C3489; }
    .amber rect  { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.5; }
    .amber text  { fill: #633806; }
    .gray rect   { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
    .gray text   { fill: #444441; }
    .arr { stroke: #888; stroke-width: 1; fill: none; }
    .loop { stroke: #999; stroke-width: 1; fill: none; stroke-dasharray: 5 3; }
    .branch { stroke: #888; stroke-width: 0.5; fill: none; }
  </style>
</defs>

<!-- Phase A -->
<rect x="40" y="28" width="600" height="230" rx="12" class="phase-rect"/>
<text class="ts" x="56" y="48">Phase A — once per run</text>

<g class="teal"><rect x="56" y="60" width="160" height="56" rx="8"/>
  <text class="th" x="136" y="83" text-anchor="middle" dominant-baseline="central">ICISNET</text>
  <text class="ts" x="136" y="101" text-anchor="middle" dominant-baseline="central">Declaration list → PDF</text>
</g>

<g class="teal"><rect x="258" y="60" width="160" height="56" rx="8"/>
  <text class="th" x="338" y="83" text-anchor="middle" dominant-baseline="central">SAP database</text>
  <text class="ts" x="338" y="101" text-anchor="middle" dominant-baseline="central">Posted declarations</text>
</g>

<g class="purple"><rect x="460" y="60" width="168" height="56" rx="8"/>
  <text class="th" x="544" y="80" text-anchor="middle" dominant-baseline="central">Power Query</text>
  <text class="ts" x="544" y="100" text-anchor="middle" dominant-baseline="central">/ Python pandas</text>
</g>

<line x1="216" y1="88" x2="256" y2="88" class="arr" marker-end="url(#arrow)"/>
<line x1="418" y1="88" x2="458" y2="88" class="arr" marker-end="url(#arrow)"/>
<path d="M 544 116 L 544 174 L 340 174 L 340 194" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="443" y="167" text-anchor="middle">New MRNs only</text>

<g class="amber"><rect x="210" y="194" width="260" height="56" rx="8"/>
  <text class="th" x="340" y="215" text-anchor="middle" dominant-baseline="central">Approval popup</text>
  <text class="ts" x="340" y="233" text-anchor="middle" dominant-baseline="central">Operator reviews and selects</text>
</g>

<line x1="340" y1="250" x2="340" y2="308" class="arr" marker-end="url(#arrow)"/>

<!-- Phase B -->
<rect x="40" y="282" width="600" height="448" rx="12" class="phase-rect"/>
<text class="ts" x="56" y="302">Phase B — per selected MRN</text>

<g class="teal"><rect x="210" y="308" width="260" height="56" rx="8"/>
  <text class="th" x="340" y="329" text-anchor="middle" dominant-baseline="central">ICISNET — download XML</text>
  <text class="ts" x="340" y="349" text-anchor="middle" dominant-baseline="central">Message type ID29 per MRN</text>
</g>

<line x1="340" y1="364" x2="340" y2="394" class="arr" marker-end="url(#arrow)"/>

<g class="purple"><rect x="210" y="394" width="260" height="56" rx="8"/>
  <text class="th" x="340" y="415" text-anchor="middle" dominant-baseline="central">Power Query / Python pandas</text>
  <text class="ts" x="340" y="433" text-anchor="middle" dominant-baseline="central">Parse XML → line items</text>
</g>

<line x1="340" y1="450" x2="340" y2="480" class="arr" marker-end="url(#arrow)"/>

<g class="teal"><rect x="210" y="480" width="260" height="56" rx="8"/>
  <text class="th" x="340" y="500" text-anchor="middle" dominant-baseline="central">SAP entry</text>
  <text class="ts" x="340" y="520" text-anchor="middle" dominant-baseline="central">Regime routing + alloy fields</text>
</g>

<line x1="340" y1="536" x2="340" y2="566" class="arr" marker-end="url(#arrow)"/>

<g class="teal"><rect x="210" y="566" width="260" height="44" rx="8"/>
  <text class="th" x="340" y="588" text-anchor="middle" dominant-baseline="central">Attach PDF to SAP record</text>
</g>

<line x1="340" y1="610" x2="340" y2="640" class="arr" marker-end="url(#arrow)"/>

<g class="gray"><rect x="210" y="640" width="260" height="56" rx="8"/>
  <text class="th" x="340" y="660" text-anchor="middle" dominant-baseline="central">Archive PDF</text>
  <text class="ts" x="340" y="680" text-anchor="middle" dominant-baseline="central">File to appropriate folder</text>
</g>

<!-- Loop arrow -->
<path d="M 210 668 L 52 668 L 52 336 L 208 336" class="loop" marker-end="url(#arrow)"/>
<text class="ts" x="58" y="502">&#8635; next MRN</text>

<!-- Stack note -->
<text class="ts" x="340" y="752" text-anchor="middle">Stack: Python (Selenium, pywinauto, pandas) · Power Automate Desktop · Power Query M · SAP GUI</text>
</svg>
